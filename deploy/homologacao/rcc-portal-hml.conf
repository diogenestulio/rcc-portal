# Portal RCC (HOMOLOGAÇÃO) — publicado pelo Nginx compartilhado do HelpDesk (container helpdesk-nginx-1).
# Cópias: /opt/helpdesk/nginx/conf.d/rcc-portal-hml.conf (VPS) E nginx/conf.d/ do repositório local do helpdesk
# (o deploy do HelpDesk reenvia essa pasta inteira e apagaria este arquivo).
# Aplicar com: nginx -t + docker restart helpdesk-nginx-1 (nunca "nginx -s reload" neste container).
# A porta 10443 precisa estar no ports: do compose do helpdesk (e no repositório local dele).

server {
    listen 10443 ssl;
    server_name 179-197-73-172.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/179-197-73-172.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/179-197-73-172.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    error_page 497 =301 https://$host:10443$request_uri;

    # Homologação protegida: senha na frente de TUDO (inclusive páginas públicas) e nada indexável.
    auth_basic "Homologacao RCC - acesso restrito";
    auth_basic_user_file /etc/nginx/conf.d/rcc-portal-hml.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Resolução tardia: o Nginx sobe mesmo se o portal estiver parado (não derruba os outros sistemas).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rcc_hml rcc-hml-app;

    client_max_body_size 12m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;   # substitui (não acumula) — o app usa o 1º valor para limite por IP
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://$rcc_hml:3000;
    }
}
