# Portal RCC Arquidiocese de Cuiabá — HOMOLOGAÇÃO na VPS compartilhada (Hostinger, 1 vCPU / 3,9 GB).
# Fica em /opt/rcc-portal-hml/docker-compose.yml. Nenhuma porta publicada: o Nginx do HelpDesk
# (rede externa helpdesk_default) encaminha https://179-197-73-172.sslip.io:10443 para rcc-hml-app:3000.
# Limites de memória somam ~832 MB (uso real esperado ~350–450 MB). Só dados fictícios.
name: rcc-portal-hml

x-app: &app
  image: rcc-portal:${RCC_VERSAO:?defina RCC_VERSAO no .env}
  env_file: .env
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "effective_cache_size=192MB", "-c", "work_mem=4MB", "-c", "max_connections=30"]
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [interna]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 10
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

  # Uso: docker compose run --rm migrate
  migrate:
    <<: *app
    restart: "no"
    profiles: [ferramentas]
    command: ["node", "scripts/migrate.mjs"]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [interna]

  # Uso: docker compose run --rm ferramentas scripts/seed-dev.mjs   (ou create-admin.mjs, verify-audit.mjs)
  ferramentas:
    <<: *app
    restart: "no"
    profiles: [ferramentas]
    entrypoint: ["node"]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [interna]

  # ATENÇÃO: o nome do serviço vira nome DNS em TODAS as redes do contêiner, inclusive helpdesk_default.
  # Nunca usar "app", "web", "api", "db" etc. — "app" colidiu com o HelpDesk em 10/11/2026 (incidente).
  rcc-portal:
    <<: *app
    depends_on: { postgres: { condition: service_healthy } }
    networks:
      interna: {}
      borda: { aliases: [rcc-hml-app] }
    environment: { MEDIA_DIR: /data/media }
    volumes: [midia:/data/media]
    mem_limit: 384m

  worker:
    <<: *app
    command: ["node", "scripts/worker.mjs"]
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      EMAIL_DIR: /data/emails
      # Monitoramento (alertas no Telegram só se TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID estiverem no .env)
      HEALTH_URL: http://rcc-portal:3000/api/health
      MONITOR_PUBLIC_URL: ${APP_URL}
      ALERT_EXPECT_BACKUP: "true"
      # Cópia externa (PC hoje; NAS da UP no futuro) registrada por backup-externo.sh; alerta após 50 h sem cópia.
      ALERT_EXPECT_BACKUP_EXTERNO: "true"
    volumes: [emails:/data/emails]
    # "saida": rede própria só para o worker acessar a internet (Telegram, SMTP). NÃO é a rede do HelpDesk.
    networks: [interna, saida]
    mem_limit: 192m
    healthcheck: { disable: true }

volumes:
  pgdata:
  emails:
  midia:

networks:
  interna:
    internal: true
  saida: {}
  borda:
    external: true
    name: helpdesk_default
